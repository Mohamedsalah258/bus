name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bus -d bus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://bus:ci-test-only@localhost:5432/bus_test
